# Deploy the API, Redis, PostgreSQL, worker and scheduler on Render.
# The static browser client is deployed separately on Vercel.
services:
  - type: web
    name: helploop-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: helploop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: helploop-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_INVITE
        generateValue: true
      - key: FRONTEND_URLS
        value: https://YOUR-VERCEL-DOMAIN.vercel.app
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SLA_MINUTES
        value: "15"
    disk:
      name: helploop-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: worker
    name: helploop-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.tasks worker -l info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: helploop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: helploop-redis
          property: connectionString

  - type: worker
    name: helploop-beat
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.tasks beat -l info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: helploop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: helploop-redis
          property: connectionString

  - type: keyvalue
    name: helploop-redis
    plan: 256mb
    region: singapore
    maxmemoryPolicy: allkeys-lru

databases:
  - name: helploop-db
    plan: basic-256mb
    region: singapore
    databaseName: helploop
    user: helploop
    postgresMajorVersion: "16"
    ipAllowList: []

