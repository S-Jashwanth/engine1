x-api: &api
  build: .
  restart: on-failure
  environment:
    DATABASE_URL: postgresql+asyncpg://chat:chat@db:5432/chat
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: change-me-in-prod
    AGENT_INVITE: agent-demo
    SLA_MINUTES: "2"
    UPLOAD_DIR: /data/uploads
  volumes: [uploads:/data/uploads]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}

services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: chat, POSTGRES_PASSWORD: chat, POSTGRES_DB: chat}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U chat"], interval: 3s, retries: 15}
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  api1:
    <<: *api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  api2:
    <<: *api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    <<: *api
    command: celery -A app.tasks worker -l info
  beat:
    <<: *api
    command: celery -A app.tasks beat -l info
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api1, api2]

volumes: {uploads: {}, pg: {}}
